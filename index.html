<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Preload Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Italiana&family=Cinzel:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />

    <title>Sri Shringaar — Luxury Indian Bridal Jewellery & Apparels</title>

    <style>
      /* Critical CSS for loading screen - prevents FOUC */
      html { background-color: #0A0A0A; box-sizing: border-box; }
      body { margin: 0; font-family: 'Manrope', 'Inter', sans-serif; background-color: #0A0A0A; color: #F5F0E8; overflow-x: hidden; }
      #root { min-height: 100vh; }
      .initial-loader, .initial-loader * { margin: 0; padding: 0; box-sizing: border-box; }
      .initial-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: #0A0A0A;
      }
      .initial-loader .logo-text {
        font-family: 'Cinzel', 'Cormorant Garamond', serif;
        font-size: 2rem; font-weight: 500; letter-spacing: 0.32em;
        color: #C9A96E; opacity: 0;
        animation: logoFadeIn 1.2s ease-out 0.3s forwards;
      }
      .initial-loader .loader-bar {
        width: 120px; height: 1px; background: rgba(201,169,110,0.2);
        margin-top: 2rem; position: relative; overflow: hidden;
      }
      .initial-loader .loader-bar::after {
        content: ''; position: absolute; left: -100%; top: 0;
        width: 100%; height: 100%; background: #C9A96E;
        animation: loaderSlide 1.5s ease-in-out infinite;
      }
      @keyframes logoFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes loaderSlide {
        0% { left: -100%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <div class="logo-text">SRI SHRINGAAR</div>
        <div class="loader-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
