<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X8LZBGGKE2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X8LZBGGKE2');
    </script>

    <!-- Preconnect to font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical resources for parallel loading -->
    <link rel="preload" as="image" href="/banner/banner1.webp" fetchpriority="high" type="image/webp" />

    <!-- Load Google Fonts non-render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&family=Cinzel:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&family=Cinzel:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&family=Cinzel:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <title>Sri Shringaar — Luxury Indian Bridal Jewellery & Apparels</title>

    <style>
      /* Critical CSS — prevents FOUC */
      html { background-color: #0A0A0A; box-sizing: border-box; }
      body { margin: 0; font-family: 'Manrope', 'Inter', sans-serif; background-color: #0A0A0A; color: #F5F0E8; overflow-x: hidden; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static hero shell — renders immediately before React hydrates, becomes the LCP element -->
      <div style="position:relative;height:600px;overflow:hidden;background:#0A0A0A;">
        <img src="/banner/banner1.webp" alt="Sri Shringaar bridal jewellery" fetchpriority="high" decoding="sync" width="1055" height="600" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;" />
        <div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(10,10,10,0.82) 0%,rgba(10,10,10,0.55) 40%,rgba(10,10,10,0.1) 70%,transparent 100%);"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
