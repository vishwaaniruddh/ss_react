<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />


    <!-- Preconnect to font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Responsive LCP Image Preload: critical for sub-second mobile & desktop LCP -->
    <link rel="preload" as="image" href="/banners/rental-collection-mobile.webp" media="(max-width: 768px)" fetchpriority="high" type="image/webp" />
    <link rel="preload" as="image" href="/banners/rental-collection.webp" media="(min-width: 769px)" fetchpriority="high" type="image/webp" />

    <!-- Load Google Fonts non-render-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@400;500;600&family=Italiana&family=Manrope:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />

    <title>Sri Shringaar — Luxury Bridal Jewellery & Designer Outfits on Rent in Mumbai</title>
    <meta name="description" content="Sri Shringaar - Mumbai's premier destination to rent designer bridal lehengas, evening gowns, heirloom Kundan, Polki and American Diamond jewellery." />

    <style>
      /* Critical CSS — prevents FOUC */
      html { background-color: #0A0A0A; box-sizing: border-box; }
      body { margin: 0; font-family: 'Manrope', 'Inter', sans-serif; background-color: #0A0A0A; color: #F5F0E8; overflow-x: hidden; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static hero shell — renders immediately during initial HTML paint, becomes instant LCP element -->
      <div style="position:relative;height:100dvh;min-height:560px;overflow:hidden;background:#0A0A0A;">
        <picture>
          <source media="(min-width: 769px)" srcset="/banners/rental-collection.webp" type="image/webp" />
          <img src="/banners/rental-collection-mobile.webp" alt="Sri Shringaar luxury bridal fashion rental in Mumbai" fetchpriority="high" decoding="sync" width="768" height="1024" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;" />
        </picture>
        <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(10,10,10,0.96) 0%, rgba(10,10,10,0.85) 35%, rgba(10,10,10,0.2) 65%, rgba(10,10,10,0.35) 100%);pointer-events:none;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Google tag (gtag.js) - loaded when main thread is idle or on interaction to eliminate blocking payload -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X8LZBGGKE2');

      function loadGtag() {
        if (window.__gtagLoaded) return;
        window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-X8LZBGGKE2';
        document.body.appendChild(s);
      }

      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() { setTimeout(loadGtag, 3000); });
      } else {
        window.addEventListener('load', function() { setTimeout(loadGtag, 3000); });
      }
      ['scroll', 'touchstart', 'mousemove', 'keydown'].forEach(function(ev) {
        window.addEventListener(ev, loadGtag, { once: true, passive: true });
      });
    </script>
  </body>
</html>
